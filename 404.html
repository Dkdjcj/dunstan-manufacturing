<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Dunstan Manufacturing</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="IMAGE/image.png">

    <style>
        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:#f5f5f5;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            text-align:center;
        }

        .error-box{
            max-width:700px;
            padding:40px;
        }

        h1{
            font-size:90px;
            color:#f39c12;
            margin:0;
        }

        h2{
            font-size:35px;
            margin:10px 0;
        }

        p{
            color:#666;
            font-size:18px;
            line-height:1.6;
        }

        a{
            display:inline-block;
            margin-top:25px;
            padding:14px 30px;
            background:#f39c12;
            color:#fff;
            text-decoration:none;
            border-radius:5px;
            font-weight:bold;
        }

        a:hover{
            background:#d68910;
        }
    </style>

</head>

<body>

<div class="error-box">

    <h1>404</h1>

    <h2>Page Not Found</h2>

    <p>
        Sorry! The page you are looking for doesn't exist.
        Please return to the homepage.
    </p>

    <a href="/dunstan-manufacturing/">Back to Home</a>
</div>

</body>
</html>
