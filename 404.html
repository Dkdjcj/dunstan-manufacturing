<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Dunstan Manufacturing</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="IMAGE/image.png">

    <style>
       body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
    url('https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=1600&q=80');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
}
        .error-box{
    max-width:700px;
    padding:50px;
    background:rgba(255,255,255,.95);
    border-radius:15px;
    box-shadow:0 10px 35px rgba(0,0,0,.25);
}

        h1{
            font-size:90px;
            color:#f39c12;
            margin:0;
        }

        h2{
            font-size:35px;
            margin:10px 0;
        }

        p{
            color:#666;
            font-size:18px;
            line-height:1.6;
        }

        a{
            display:inline-block;
            margin-top:25px;
            padding:14px 30px;
            background:#f39c12;
            color:#fff;
            text-decoration:none;
            border-radius:5px;
            font-weight:bold;
        }

        a:hover{
            background:#d68910;
        }
        .error-box img{
    margin-bottom:20px;
}
    </style>

</head>

<body>

<div class="error-box">

    <img src="IMAGE/image.png"
         alt="Dunstan Manufacturing Logo"
         width="140">

    <h1>404</h1>

    <p>
        Sorry! The page you are looking for doesn't exist.

    </p>

</html>
